name: Preview comment

# Posts the preview Validate wrote as one comment on the pull request, updated in place on every run. Validate runs a fork's PR with a read-only token, so it cannot comment itself; this workflow can, and is safe to give pull-requests: write because a workflow_run workflow always runs the default branch's copy of this file, never the PR's, and it never checks out or runs anything from the PR. The artifact it reads was written by a run of the PR's code, so it is handled as untrusted text: the PR number in it must be a number whose PR head is the commit Validate ran on, the comment is cut to GitHub's size limit, and @mentions in it are defused so a PR cannot ping people through the bot.
on:
  workflow_run:
    workflows: [Validate]
    types: [completed]

permissions: {}

jobs:
  comment:
    name: Comment
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Download the preview
        id: download
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: preview
          path: ${{ runner.temp }}/preview
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Post or update the comment
        if: steps.download.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          dir="$RUNNER_TEMP/preview"
          marker='<!-- kando-plugins-preview -->'
          pr=$(head -c 16 "$dir/pr-number" | tr -d '[:space:]')
          if ! [[ "$pr" =~ ^[0-9]{1,9}$ ]]; then
            echo "::error::the artifact's PR number is not a number"
            exit 1
          fi
          # The PR must be open and its head the commit Validate ran on: an artifact cannot point the comment at another PR.
          pr_head=$(gh api "repos/$REPO/pulls/$pr" --jq 'select(.state == "open") | .head.sha')
          if [ "$pr_head" != "$RUN_HEAD_SHA" ]; then
            echo "PR #$pr is closed or has moved on from $RUN_HEAD_SHA; a newer run comments."
            exit 0
          fi
          {
            echo "$marker"
            echo
            # The PR's text: cut to stay under GitHub's 65536-character limit (dropping a character the cut split), the marker taken out, and every @ followed by a name given a zero-width space so it mentions nobody.
            head -c 60000 "$dir/comment.md" | iconv -c -f UTF-8 -t UTF-8 | sed -e "s/$marker//g" -e 's/@\([A-Za-z0-9]\)/@\xe2\x80\x8b\1/g'
            echo
            echo "---"
            echo "Validate: **$CONCLUSION**. [Run log]($RUN_URL)"
          } > "$RUNNER_TEMP/body.md"
          jq -n --rawfile body "$RUNNER_TEMP/body.md" '{body: $body}' > "$RUNNER_TEMP/body.json"
          existing=$(gh api --paginate "repos/$REPO/issues/$pr/comments" --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$existing" --input "$RUNNER_TEMP/body.json" > /dev/null
            echo "Updated the comment on #$pr."
          else
            gh api --method POST "repos/$REPO/issues/$pr/comments" --input "$RUNNER_TEMP/body.json" > /dev/null
            echo "Commented on #$pr."
          fi
